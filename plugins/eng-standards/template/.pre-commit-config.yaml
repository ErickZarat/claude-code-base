# Second safety net that does not depend on Claude: blocks commits containing secrets.
# Setup once per clone:  pip install pre-commit && pre-commit install && pre-commit autoupdate
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2  # run `pre-commit autoupdate` to move to the latest release
    hooks:
      - id: gitleaks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: detect-private-key
      - id: check-added-large-files
      - id: check-merge-conflict
