name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]  # macOS runs the installer on bash 3.2, like a real Mac
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test tools
        run: pip install pytest shellcheck-py

      - name: Validate marketplace, plugin, skills and agents
        run: python scripts/validate.py

      - name: Shellcheck installer scripts
        run: shellcheck install.sh plugins/eng/install.sh

      - name: Tests
        run: pytest -q

  hook-python39:
    # Hook and scripts run with whatever python3 the developer has; macOS bundles 3.9.
    # Pinned: setup-python has no 3.9 build for ubuntu-latest (26.04).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - run: pip install pytest && pytest -q tests/test_guard_secrets.py tests/test_github_sync.py tests/test_review_packet.py tests/test_pr_checklist.py tests/test_review_coverage.py

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
